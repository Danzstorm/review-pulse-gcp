name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    name: Lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            generator/requirements.txt
            pipelines/dataflow/requirements.txt
            agent/requirements.txt
      # The pipeline's BigQuery sink is a Java cross-language transform.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: pip install ruff -r generator/requirements.txt -r pipelines/dataflow/requirements.txt -r agent/requirements.txt
      - run: ruff check .
      - run: python tests/test_generator.py
      - run: python tests/test_pipeline.py
      - run: python tests/test_agent.py

  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform -chdir=infra fmt -check -recursive
      - run: terraform -chdir=infra init -backend=false
      - run: terraform -chdir=infra validate
