name: Deploy agent

# Builds the agent image and rolls out a new Cloud Run revision. It authenticates with
# Workload Identity Federation: no key is stored anywhere. GCP only accepts tokens from this
# repository's main branch (see infra/github_actions.tf).
on:
  push:
    branches: [main]
    paths: [agent/**, scripts/deploy_agent.sh, .github/workflows/deploy-agent.yml]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # lets the job request the signed GitHub token GCP verifies

concurrency:
  group: deploy-agent
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PROJECT_ID: ${{ vars.PROJECT_ID }}
      REGION: ${{ vars.REGION }}
      BUILDER_EMAIL: ${{ vars.BUILDER_EMAIL }}
      BUILDS_BUCKET: ${{ vars.BUILDS_BUCKET }}
      AGENT_IMAGE: ${{ vars.AGENT_IMAGE }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOYER_EMAIL }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: bash scripts/deploy_agent.sh
